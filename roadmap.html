<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Quest – Become an AI Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== RESET & ROOT ===== */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0e1117;
  --bg2: #161b26;
  --bg3: #1d2535;
  --bg4: #242e42;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f0f2f8;
  --muted: #8892aa;
  --dim: #4a5472;

  --xp: #58cc02;
  --xp-dark: #3d9900;
  --fire: #ff9600;
  --gem: #1cb0f6;
  --heart: #ff4b4b;

  --l1: #6c63ff; --l1b: rgba(108,99,255,0.15);
  --l2: #00c896; --l2b: rgba(0,200,150,0.12);
  --l3: #4ecdc4; --l3b: rgba(78,205,196,0.12);
  --l4: #ffd166; --l4b: rgba(255,209,102,0.12);
  --l5: #f7931e; --l5b: rgba(247,147,30,0.12);
  --l6: #ff6b6b; --l6b: rgba(255,107,107,0.12);
  --l7: #c77dff; --l7b: rgba(199,125,255,0.12);
  --l8: #ff9a3c; --l8b: rgba(255,154,60,0.12);

  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 7px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 99px; }

/* ===== LAYOUT ===== */
.app { display: flex; min-height: 100vh; }

/* ===== SIDEBAR ===== */
.sidebar {
  width: 280px; flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
  overflow-y: auto;
  z-index: 10;
}
.sidebar-logo {
  padding: 24px 24px 20px;
  border-bottom: 1px solid var(--border);
}
.logo-mark {
  display: flex; align-items: center; gap: 10px;
  font-size: 22px; font-weight: 900; letter-spacing: -.02em;
}
.logo-icon {
  width: 38px; height: 38px; border-radius: 10px;
  background: linear-gradient(135deg, #6c63ff, #00c896);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.logo-sub { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }

/* Stats bar */
.stats-bar {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
}
.stat-item {
  flex: 1; padding: 14px 12px; text-align: center;
  border-right: 1px solid var(--border);
  cursor: default;
}
.stat-item:last-child { border-right: none; }
.stat-val { font-size: 18px; font-weight: 900; }
.stat-lbl { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; margin-top: 2px; }
.fire-val { color: var(--fire); }
.xp-val { color: var(--xp); }
.gem-val { color: var(--gem); }

/* Nav levels */
.nav-section { padding: 14px 16px 8px; }
.nav-section-label { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: var(--radius-sm);
  cursor: pointer; transition: background .15s;
  font-size: 13.5px; font-weight: 700;
  margin-bottom: 2px;
  position: relative;
}
.nav-item:hover { background: var(--bg3); }
.nav-item.active { background: var(--bg3); }
.nav-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid;
}
.nav-dot.done { background: currentColor; }
.nav-dot.locked { background: var(--bg4); border-color: var(--dim); }
.nav-progress-pill {
  margin-left: auto;
  font-size: 10px; font-weight: 800;
  padding: 2px 7px; border-radius: 100px;
  background: rgba(255,255,255,0.07);
  color: var(--muted);
}

/* XP bar in sidebar */
.xp-bar-wrap {
  margin: 16px 16px 0;
  background: var(--bg3); border-radius: 99px; height: 8px; overflow: hidden;
}
.xp-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--xp), #a0e800);
  border-radius: 99px;
  transition: width .6s cubic-bezier(.4,0,.2,1);
}
.xp-bar-label { font-size: 11px; color: var(--muted); font-weight: 700; padding: 6px 16px 16px; display: flex; justify-content: space-between; }

/* ===== MAIN ===== */
.main { flex: 1; overflow-y: auto; min-width: 0; }

/* ===== HOME VIEW ===== */
.home-hero {
  background: linear-gradient(135deg, #0e1117 0%, #161b26 100%);
  padding: 48px 48px 40px;
  border-bottom: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.home-hero::before {
  content: '';
  position: absolute; top: -80px; right: -80px;
  width: 400px; height: 400px; border-radius: 50%;
  background: radial-gradient(circle, rgba(108,99,255,.1) 0%, transparent 70%);
  pointer-events: none;
}
.home-hero::after {
  content: '';
  position: absolute; bottom: -60px; left: 200px;
  width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,200,150,.07) 0%, transparent 70%);
  pointer-events: none;
}
.hero-greeting { font-size: 13px; font-weight: 800; color: var(--xp); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
.hero-title { font-size: 36px; font-weight: 900; line-height: 1.15; letter-spacing: -.02em; margin-bottom: 10px; }
.hero-title span { background: linear-gradient(90deg, #6c63ff, #00c896); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero-sub { font-size: 16px; color: var(--muted); font-family: 'Nunito Sans', sans-serif; line-height: 1.6; max-width: 500px; }

/* Today's mission card */
.mission-strip {
  margin: 28px 48px 0;
  background: var(--bg2);
  border: 1.5px solid rgba(88,204,2,.25);
  border-radius: var(--radius);
  padding: 20px 24px;
  display: flex; align-items: center; gap: 16px;
  position: relative; z-index: 1;
}
.mission-flame { font-size: 32px; flex-shrink: 0; animation: flameBounce 1.5s ease-in-out infinite; }
@keyframes flameBounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1) rotate(-5deg)} }
.mission-body { flex: 1; min-width: 0; }
.mission-label { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--xp); margin-bottom: 4px; }
.mission-text { font-size: 15px; font-weight: 800; }
.mission-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; font-family: 'Nunito Sans', sans-serif; }
.mission-btn {
  background: var(--xp); color: #fff; border: none;
  padding: 10px 20px; border-radius: var(--radius-sm);
  font-family: 'Nunito', sans-serif;
  font-size: 14px; font-weight: 900; cursor: pointer;
  transition: transform .1s, background .15s;
  white-space: nowrap; flex-shrink: 0;
}
.mission-btn:hover { background: var(--xp-dark); transform: translateY(-1px); }
.mission-btn:active { transform: scale(.97); }

/* Level path grid */
.path-section { padding: 40px 48px 60px; }
.section-hd { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; }

.level-path { display: flex; flex-direction: column; gap: 16px; }

.level-node {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: border-color .2s, transform .15s;
}
.level-node:hover { transform: translateY(-2px); border-color: var(--border2); }
.level-node.locked { opacity: .5; cursor: not-allowed; pointer-events: none; }

.level-node-header {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 22px;
}
.level-num-badge {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 900; flex-shrink: 0;
}
.level-node-info { flex: 1; }
.level-node-tag { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 3px; }
.level-node-title { font-size: 18px; font-weight: 900; letter-spacing: -.01em; }
.level-node-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; font-family: 'Nunito Sans', sans-serif; }
.level-node-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
.level-progress-ring { position: relative; width: 52px; height: 52px; }
.level-progress-ring svg { transform: rotate(-90deg); }
.level-progress-ring .ring-bg { fill: none; stroke: var(--bg4); stroke-width: 4; }
.level-progress-ring .ring-fill { fill: none; stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.4,0,.2,1); }
.ring-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; }
.level-xp-badge { font-size: 11px; font-weight: 800; color: var(--xp); background: rgba(88,204,2,.12); padding: 3px 8px; border-radius: 100px; }

/* Progress bar on node */
.node-prog-bar { height: 4px; background: var(--bg3); }
.node-prog-fill { height: 100%; border-radius: 0 0 0 0; transition: width .6s; }

/* ===== LEVEL VIEW ===== */
.level-view { padding: 0; }

.level-topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 20px 48px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  position: sticky; top: 0; z-index: 5;
}
.back-btn {
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text); padding: 8px 16px; border-radius: var(--radius-sm);
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800;
  cursor: pointer; transition: background .15s;
}
.back-btn:hover { background: var(--bg4); }
.topbar-title { font-size: 16px; font-weight: 900; }
.topbar-sub { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 600; }
.topbar-xp { margin-left: auto; font-size: 13px; font-weight: 900; color: var(--xp); background: rgba(88,204,2,.1); padding: 6px 14px; border-radius: 100px; }

/* Level hero */
.level-hero {
  padding: 36px 48px 32px;
  border-bottom: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.level-hero-icon { font-size: 48px; margin-bottom: 12px; }
.level-hero-title { font-size: 30px; font-weight: 900; letter-spacing: -.02em; margin-bottom: 8px; }
.level-hero-desc { font-size: 15px; color: var(--muted); font-family: 'Nunito Sans', sans-serif; line-height: 1.65; max-width: 600px; }

/* Progress summary */
.prog-summary {
  display: flex; gap: 16px; margin-top: 20px; flex-wrap: wrap;
}
.prog-chip {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 16px;
  font-size: 13px; font-weight: 800;
  display: flex; align-items: center; gap: 8px;
}
.prog-chip-val { font-size: 20px; font-weight: 900; }

/* Topics */
.topics-container { padding: 32px 48px 60px; }
.topics-grid { display: flex; flex-direction: column; gap: 16px; }

.topic-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.topic-card.completed { border-color: rgba(88,204,2,.3); }

.topic-header {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 20px;
  cursor: pointer;
}
.topic-check {
  width: 36px; height: 36px; border-radius: 10px;
  border: 2.5px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
  transition: all .2s;
  background: transparent;
}
.topic-card.completed .topic-check {
  background: var(--xp); border-color: var(--xp); color: #fff;
}
.topic-info { flex: 1; min-width: 0; }
.topic-name { font-size: 15px; font-weight: 800; }
.topic-why { font-size: 12px; color: var(--muted); margin-top: 3px; font-family: 'Nunito Sans', sans-serif; line-height: 1.45; }
.topic-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.topic-xp { font-size: 12px; font-weight: 800; color: var(--xp); background: rgba(88,204,2,.1); padding: 4px 10px; border-radius: 100px; }
.topic-expand-icon { color: var(--muted); transition: transform .25s; font-size: 16px; }
.topic-card.expanded .topic-expand-icon { transform: rotate(180deg); }

/* Resources panel */
.resources-panel {
  display: none;
  border-top: 1px solid var(--border);
  padding: 20px 20px 20px 20px;
  background: var(--bg);
}
.topic-card.expanded .resources-panel { display: block; }

.resources-title {
  font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.resources-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.resource-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }

.resource-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--bg2); border: 1px solid var(--border);
  text-decoration: none; color: var(--text);
  transition: border-color .15s, background .15s;
}
.resource-item:hover { border-color: var(--border2); background: var(--bg3); }
.resource-badge {
  font-size: 9px; font-weight: 800; letter-spacing: .07em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 100px;
  flex-shrink: 0; margin-top: 2px;
}
.badge-free { background: rgba(88,204,2,.15); color: #58cc02; }
.badge-paid { background: rgba(255,209,102,.12); color: #ffd166; }
.badge-book { background: rgba(108,99,255,.15); color: #a89fff; }
.badge-yt { background: rgba(255,107,107,.15); color: #ff6b6b; }
.resource-name { font-size: 13.5px; font-weight: 700; line-height: 1.3; }
.resource-desc { font-size: 11.5px; color: var(--muted); margin-top: 3px; font-family: 'Nunito Sans', sans-serif; line-height: 1.4; }

/* Daily task */
.daily-task {
  background: linear-gradient(135deg, rgba(108,99,255,.1), rgba(0,200,150,.08));
  border: 1px solid rgba(108,99,255,.25);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-top: 4px;
}
.daily-task-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: #a89fff; margin-bottom: 6px; }
.daily-task-text { font-size: 13px; font-weight: 700; line-height: 1.5; color: var(--text); }

/* Complete button */
.complete-btn {
  width: 100%; margin-top: 14px;
  padding: 13px; border-radius: var(--radius-sm);
  font-family: 'Nunito', sans-serif;
  font-size: 14px; font-weight: 900;
  cursor: pointer; border: none;
  transition: transform .1s, opacity .2s;
}
.complete-btn.not-done {
  background: var(--xp); color: #fff;
}
.complete-btn.not-done:hover { opacity: .9; transform: translateY(-1px); }
.complete-btn.done {
  background: var(--bg3); color: var(--muted); cursor: default;
}
.complete-btn:active { transform: scale(.98); }

/* ===== PROJECT CARD ===== */
.project-section { margin-top: 40px; }
.project-card {
  background: linear-gradient(135deg, rgba(108,99,255,.1), rgba(0,200,150,.08));
  border: 1px solid rgba(108,99,255,.3);
  border-radius: var(--radius);
  padding: 24px;
}
.project-label { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #a89fff; margin-bottom: 10px; }
.project-title { font-size: 17px; font-weight: 900; margin-bottom: 8px; }
.project-desc { font-size: 14px; color: var(--muted); font-family: 'Nunito Sans', sans-serif; line-height: 1.6; }
.project-complete-btn {
  margin-top: 16px;
  background: linear-gradient(90deg, #6c63ff, #00c896);
  color: #fff; border: none;
  padding: 12px 24px; border-radius: var(--radius-sm);
  font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 900;
  cursor: pointer; transition: opacity .15s, transform .1s;
}
.project-complete-btn:hover { opacity: .88; transform: translateY(-1px); }
.project-complete-btn.done { background: var(--bg3); color: var(--muted); cursor: default; }

/* ===== EMAIL MODAL ===== */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.75); backdrop-filter: blur(6px);
  z-index: 100; display: flex; align-items: center; justify-content: center;
  padding: 24px;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 20px; padding: 32px;
  max-width: 480px; width: 100%;
  animation: slideUp .25s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
.modal-icon { font-size: 48px; text-align: center; margin-bottom: 16px; }
.modal-title { font-size: 22px; font-weight: 900; text-align: center; margin-bottom: 8px; }
.modal-sub { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.6; font-family: 'Nunito Sans', sans-serif; margin-bottom: 24px; }
.email-form { display: flex; flex-direction: column; gap: 12px; }
.email-input {
  background: var(--bg3); border: 1px solid var(--border2);
  color: var(--text); border-radius: var(--radius-sm);
  padding: 13px 16px; font-family: 'Nunito', sans-serif;
  font-size: 15px; font-weight: 600;
  outline: none; transition: border-color .2s;
}
.email-input:focus { border-color: var(--xp); }
.modal-save-btn {
  background: var(--xp); color: #fff; border: none;
  padding: 14px; border-radius: var(--radius-sm);
  font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 900;
  cursor: pointer; transition: background .15s;
}
.modal-save-btn:hover { background: var(--xp-dark); }
.modal-close {
  width: 100%; background: transparent; border: 1px solid var(--border);
  color: var(--muted); padding: 12px; border-radius: var(--radius-sm);
  font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: background .15s;
}
.modal-close:hover { background: var(--bg3); }

/* ===== XP TOAST ===== */
.xp-toast {
  position: fixed; top: 24px; right: 24px; z-index: 200;
  background: var(--bg2); border: 1.5px solid var(--xp);
  border-radius: var(--radius-sm); padding: 14px 20px;
  display: flex; align-items: center; gap: 12px;
  font-size: 15px; font-weight: 900; color: var(--xp);
  animation: toastIn .35s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 8px 32px rgba(0,0,0,.4);
  max-width: 280px;
}
@keyframes toastIn { from{transform:translateX(60px);opacity:0} to{transform:translateX(0);opacity:1} }
.xp-toast-icon { font-size: 24px; }
.xp-toast-msg { font-size: 13px; color: var(--muted); font-weight: 700; margin-top: 2px; font-family: 'Nunito Sans', sans-serif; }

/* ===== STREAK MODAL ===== */
.streak-card {
  text-align: center; padding: 8px 0 0;
}
.streak-flame-big { font-size: 72px; animation: flameBounce 1s ease-in-out infinite; display: block; margin-bottom: 8px; }
.streak-num { font-size: 64px; font-weight: 900; color: var(--fire); line-height: 1; }
.streak-label { font-size: 14px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-top: 4px; }

/* ===== EMAIL PREVIEW ===== */
.email-preview {
  background: #1a2030; border: 1px solid var(--border2);
  border-radius: var(--radius-sm); padding: 0; overflow: hidden;
  margin: 16px 0; font-family: 'Nunito Sans', sans-serif;
}
.email-header-bar {
  background: var(--bg3); padding: 12px 16px;
  font-size: 11px; color: var(--muted); font-weight: 700;
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 4px;
}
.email-body-preview {
  padding: 16px;
  font-size: 13px; color: var(--text); line-height: 1.65;
}
.email-subject { font-size: 14px; font-weight: 800; margin-bottom: 8px; color: var(--text); }

/* ===== LEVEL COLORS ===== */
.lc1 { color: var(--l1); }
.lc2 { color: var(--l2); }
.lc3 { color: var(--l3); }
.lc4 { color: var(--l4); }
.lc5 { color: var(--l5); }
.lc6 { color: var(--l6); }
.lc7 { color: var(--l7); }
.lc8 { color: var(--l8); }

/* ===== CONFETTI ===== */
.confetti-piece {
  position: fixed; width: 10px; height: 10px; border-radius: 2px;
  pointer-events: none; z-index: 300;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ===== RESPONSIVE ===== */
@media(max-width: 768px) {
  .sidebar { display: none; }
  .home-hero { padding: 28px 24px 24px; }
  .mission-strip { margin: 20px 24px 0; }

/* ============================================================
   STATE  (persisted in localStorage)
   ============================================================ */
function loadState() {
  try {
    const s = localStorage.getItem('aiquest_state');
    if (s) return JSON.parse(s);
  } catch(e) {}
  return {
    completedTopics: {},   // "levelId_topicIdx": true
    completedProjects: {}, // "levelId": true
    xp: 0,
    streak: 0,
    lastActiveDate: null,
    userEmail: '',
    userName: '',
  };
}

function saveState() {
  localStorage.setItem('aiquest_state', JSON.stringify(state));
}

let state = loadState();

/* ===== XP thresholds per "player level" ===== */
const XP_THRESHOLDS = [0, 500, 1200, 2200, 3500, 5200, 7200, 9800, 13000, 17000, 22000];

function getPlayerLevel() {
  for (let i = XP_THRESHOLDS.length - 1; i >= 0; i--) {
    if (state.xp >= XP_THRESHOLDS[i]) return i + 1;
  }
  return 1;
}

function getXpProgress() {
  const pl = getPlayerLevel();
  const base = XP_THRESHOLDS[pl - 1] ?? 0;
  const next = XP_THRESHOLDS[pl] ?? XP_THRESHOLDS[XP_THRESHOLDS.length - 1];
  const pct = Math.min(100, Math.round(((state.xp - base) / (next - base)) * 100));
  return { pct, current: state.xp - base, total: next - base, pl };
}

/* ===== Streak ===== */
function updateStreak() {
  const today = new Date().toDateString();
  if (state.lastActiveDate === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  if (state.lastActiveDate === yesterday) {
    state.streak++;
  } else if (state.lastActiveDate !== yesterday) {
    state.streak = 1;
  }
  state.lastActiveDate = today;
  saveState();
}

/* ===== Task completion count ===== */
function getTodayKey() { return new Date().toDateString(); }

function getLevelProgress(levelId) {
  const lvl = LEVELS.find(l => l.id === levelId);
  if (!lvl) return { done: 0, total: 0 };
  const total = lvl.topics.length + 1; // +1 for project
  let done = 0;
  lvl.topics.forEach((_, i) => { if (state.completedTopics[`${levelId}_${i}`]) done++; });
  if (state.completedProjects[levelId]) done++;
  return { done, total };
}

function getTotalDone() {
  let n = 0;
  Object.values(state.completedTopics).forEach(v => { if (v) n++; });
  Object.values(state.completedProjects).forEach(v => { if (v) n++; });
  return n;
}

/* ============================================================
   ROUTER
   ============================================================ */
let currentView = 'home'; // 'home' | 'level:N'

function navigate(view) {
  currentView = view;
  render();
  document.getElementById('main-content').scrollTop = 0;
}

/* ============================================================
   SIDEBAR RENDER
   ============================================================ */
function renderSidebar() {
  // Stats
  document.getElementById('sb-streak').textContent = state.streak;
  document.getElementById('sb-xp').textContent = state.xp;
  document.getElementById('sb-done').textContent = getTotalDone();

  // XP bar
  const prog = getXpProgress();
  document.getElementById('xp-bar').style.width = prog.pct + '%';
  document.getElementById('xp-level-label').textContent = `Player Lv.${prog.pl}`;
  document.getElementById('xp-to-next').textContent = `${prog.current} / ${prog.total} XP`;

  // Nav
  const nav = document.getElementById('nav-items');
  nav.innerHTML = LEVELS.map(l => {
    const { done, total } = getLevelProgress(l.id);
    const pct = Math.round((done / total) * 100);
    const isActive = currentView === `level:${l.id}`;
    return `
      <div class="nav-item ${isActive ? 'active' : ''}" onclick="navigate('level:${l.id}')">
        <div class="nav-dot ${pct === 100 ? 'done' : ''}" style="color:${l.color}; border-color:${l.color}; ${pct===100?`background:${l.color}`:''}" ></div>
        <span>${l.emoji} ${l.title}</span>
        <span class="nav-progress-pill">${pct}%</span>
      </div>
    `;
  }).join('');
}

   ============================================================ */
function renderHome() {
  // Find first incomplete level
  const nextLevel = LEVELS.find(l => {
    const { done, total } = getLevelProgress(l.id);
    return done < total;

  const todayTopicIdx = new Date().getDate() % nextLevel.topics.length;
  const todayTopic = nextLevel.topics[todayTopicIdx];
  const todayKey = `${nextLevel.id}_${todayTopicIdx}`;
  const taskDone = state.completedTopics[todayKey];

  const html = `
    <div class="home-hero">
      <div class="hero-greeting">👋 Welcome back${state.userName ? ', ' + state.userName : ''}!</div>
      <div class="hero-title">Your path to becoming<br><span>an AI Engineer</span></div>

function renderLevelNode(l) {
  const { done, total } = getLevelProgress(l.id);
  const pct = Math.round((done / total) * 100);
  const circumference = 2 * Math.PI * 22;
  const offset = circumference - (pct / 100) * circumference;

  return `
    <div class="level-node" onclick="navigate('level:${l.id}')">
      <div class="level-node-header">
        <div class="level-num-badge" style="background:${l.color}20; color:${l.color}">
          ${l.emoji}
        </div>
        <div class="level-node-info">
          <div class="level-node-tag" style="color:${l.color}">Level ${l.id} · ${l.tag}</div>
          <div class="level-node-title">${l.title}</div>
          <div class="level-node-sub">${l.topics.length} topics + 1 project</div>
        </div>
        <div class="level-node-right">
          <div class="level-progress-ring">
            <svg width="52" height="52" viewBox="0 0 52 52">
              <circle class="ring-bg" cx="26" cy="26" r="22"/>
              <circle class="ring-fill" cx="26" cy="26" r="22"
                stroke="${l.color}"
                stroke-dasharray="${circumference}"
                stroke-dashoffset="${offset}"/>
            </svg>
            <div class="ring-pct" style="color:${l.color}">${pct}%</div>
          </div>
          <div class="level-xp-badge">+${l.topics.reduce((s,t)=>s+t.xp,0)} XP</div>
        </div>
      </div>
      <div class="node-prog-bar">
        <div class="node-prog-fill" style="width:${pct}%; background:${l.color}"></div>
      </div>
    </div>
  `;
}

        <div class="resources-title">Free & Paid Resources</div>
        <div class="resource-list">
          ${topic.resources.map(r => `
            <a class="resource-item" href="${r.url}" target="_blank" rel="noopener">
              <span class="resource-badge badge-${r.type}">${r.type === 'yt' ? 'YouTube' : r.type.toUpperCase()}</span>
              <div>
                <div class="resource-name">${r.name}</div>
                <div class="resource-desc">${r.desc}</div>
              </div>
            </a>
          `).join('')}
        </div>

        <div class="daily-task">
          <div class="daily-task-label">📋 Today's Task</div>
          <div class="daily-task-text">${topic.task}</div>
        </div>

        <button class="complete-btn ${done ? 'done' : 'not-done'}"
          onclick="completeTopic(${l.id}, ${idx})"
          ${done ? 'disabled' : ''}>
          ${done ? '✅ Completed! +' + topic.xp + ' XP earned' : '✅ Mark as Complete (+' + topic.xp + ' XP)'}
        </button>
      </div>
    </div>
  `;
}

function renderProjectCard(l) {
  const done = !!state.completedProjects[l.id];
  return `
    <div class="project-card">
      <div class="project-label">🎯 Level ${l.id} Project</div>
      <div class="project-title">${l.project.title}</div>
      <div class="project-desc">${l.project.desc}</div>
      <button class="project-complete-btn ${done ? 'done' : ''}"
        onclick="completeProject(${l.id})"
        ${done ? 'disabled' : ''}>
        ${done ? '🏆 Project Complete!' : '🚀 Mark Project Complete (+150 XP)'}
      </button>
    </div>
  `;
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
function toggleTopic(levelId, idx) {
  const card = document.getElementById(`topic-${levelId}-${idx}`);
  if (!card) return;
  card.classList.toggle('expanded');
}

function completeTopic(levelId, idx) {
  const key = `${levelId}_${idx}`;
  if (state.completedTopics[key]) return;
  const l = LEVELS.find(x => x.id === levelId);
  const topic = l?.topics[idx];
  if (!topic) return;

  state.completedTopics[key] = true;
  state.xp += topic.xp;
  updateStreak();
  saveState();

  confetti();
  showXpToast(`+${topic.xp} XP`, topic.name.replace(/^[\S]+\s/, ''));

  // Re-render this card only
  const card = document.getElementById(`topic-${levelId}-${idx}`);
  if (card) {
    card.classList.add('completed');
    card.classList.remove('expanded');
    const check = card.querySelector('.topic-check');
    if (check) check.textContent = '✓';
    const btn = card.querySelector('.complete-btn');
    if (btn) {
      btn.textContent = `✅ Completed! +${topic.xp} XP earned`;
      btn.className = 'complete-btn done';
      btn.disabled = true;
    }
    // Update resources panel button too
    card.querySelector('.resources-panel .complete-btn').textContent = `✅ Completed! +${topic.xp} XP earned`;
  }

  // Update sidebar
  renderSidebar();

  // Check if all topics done — prompt email if no email set
  const { done, total } = getLevelProgress(levelId);
  if (done === total && !state.userEmail) {
    setTimeout(showEmailModal, 800);
  }
}

function completeProject(levelId) {
  if (state.completedProjects[levelId]) return;
  state.completedProjects[levelId] = true;
  state.xp += 150;
  updateStreak();
  saveState();

  confetti();
  confetti(200);
  showXpToast('+150 XP', 'Project complete! 🏆');
  renderSidebar();

  // Re-render level
  const btn = document.querySelector('.project-complete-btn');
  if (btn) {
    btn.textContent = '🏆 Project Complete!';
    btn.className = 'project-complete-btn done';
    btn.disabled = true;
  }
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render() {
  updateStreak();
  renderSidebar();

  if (currentView === 'home') {
    renderHome();
  } else if (currentView.startsWith('level:')) {
    const id = parseInt(currentView.split(':')[1]);
    renderLevel(id);
  }
}

/* ============================================================
   EMAIL MODAL
   ============================================================ */
function showEmailModal() {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" onclick="closeModalIfBackdrop(event)">
      <div class="modal">
        <div class="modal-icon">📧</div>
        <div class="modal-title">Stay on track</div>
        <div class="modal-sub">Set up a daily reminder email. If you miss a day without completing a task, AI Quest will send you a motivational nudge to keep your streak alive.</div>

        <div class="email-preview">
          <div class="email-header-bar">
            <span>From: aiquest@noreply.com</span>
            <span>Subject: 🔥 Your streak is at risk, ${state.userName || 'learner'}!</span>
          </div>
          <div class="email-body-preview">
            <div class="email-subject">Don't break your streak! 😢</div>
            Hey ${state.userName || 'there'}! You haven't completed today's task yet —
            <strong>${state.streak} days</strong> of hard work could reset to zero.
            Today's challenge: <em>just one topic</em>. It takes ~15 minutes.
            <br><br>
            Click below to jump back in and protect your streak 🔥
          </div>
        </div>

        <div class="email-form">
          <input type="text" class="email-input" id="modal-name" placeholder="Your first name" value="${state.userName || ''}">
          <input type="email" class="email-input" id="modal-email" placeholder="your@email.com" value="${state.userEmail || ''}">
          <button class="modal-save-btn" onclick="saveEmail()">💌 Save Reminder Settings</button>
          <button class="modal-close" onclick="closeModal()">Maybe later</button>
        </div>
      </div>
    </div>
  `;
}

function saveEmail() {
  const name = document.getElementById('modal-name')?.value?.trim();
  const email = document.getElementById('modal-email')?.value?.trim();
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!email || !emailRegex.test(email)) {
    alert('Please enter a valid email address.');
    return;
  }
  state.userName = name || '';
  state.userEmail = email;
  saveState();
  closeModal();
  showXpToast('+10 XP', 'Reminder set up! Stay consistent 🙌');
  state.xp += 10;
  saveState();
  renderSidebar();
  // Show confirmation
  showToast(`📧 Reminder set for ${email}! You'll get a nudge if you miss a day.`);
}

function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
}

function closeModalIfBackdrop(e) {
  if (e.target.classList.contains('modal-backdrop')) closeModal();
}

/* ============================================================
   STREAK MODAL
   ============================================================ */
function showStreakModal() {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" onclick="closeModalIfBackdrop(event)">
      <div class="modal">
        <div class="streak-card">
          <span class="streak-flame-big">🔥</span>
          <div class="streak-num">${state.streak}</div>
          <div class="streak-label">Day Streak</div>
        </div>
        <div class="modal-sub" style="margin-top:20px">
          ${state.streak === 0
            ? 'Complete your first task today to start your streak!'
            : state.streak < 7
            ? `Great start! Keep going — 7 days builds a real habit.`
            : state.streak < 30
            ? `Impressive! ${state.streak} days of consistency. You're building something real.`
            : `🏆 ${state.streak} days! You're in the top tier of self-learners.`}
        </div>
        <button class="modal-close" onclick="closeModal()">Close</button>
      </div>
    </div>
  `;
}

/* ============================================================
   TOAST
   ============================================================ */
function showXpToast(xpText, message) {
  const root = document.getElementById('toast-root');
  const id = 'toast-' + Date.now();
  root.innerHTML += `
    <div class="xp-toast" id="${id}">
      <span class="xp-toast-icon">⚡</span>
      <div>
        <div>${xpText}</div>
        <div class="xp-toast-msg">${message}</div>
      </div>
    </div>
  `;
  setTimeout(() => { document.getElementById(id)?.remove(); }, 3500);
}

function showToast(msg) {
  const root = document.getElementById('toast-root');
  const id = 'toast-' + Date.now();
  root.innerHTML += `
    <div class="xp-toast" id="${id}" style="border-color:var(--gem);color:var(--gem)">
      <span class="xp-toast-icon">✉️</span>
      <div><div style="font-size:13px;line-height:1.4">${msg}</div></div>
    </div>
  `;
  setTimeout(() => { document.getElementById(id)?.remove(); }, 4000);
}

/* ============================================================
   CONFETTI
   ============================================================ */
function confetti(delay = 0) {
  const colors = ['#6c63ff','#00c896','#ffd166','#ff6b6b','#4ecdc4','#f7931e','#58cc02'];
  setTimeout(() => {
    for (let i = 0; i < 40; i++) {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left: ${Math.random() * 100}%;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        animation-duration: ${0.8 + Math.random() * 1.2}s;
        animation-delay: ${Math.random() * 0.3}s;
        width: ${6 + Math.random() * 8}px;
        height: ${6 + Math.random() * 8}px;
        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }
  }, delay);
}

/* ============================================================
   BOOT
   ============================================================ */
// Show email modal on first visit
if (!state.userEmail && !state.userName) {
  setTimeout(showEmailModal, 1500);
}

render();
</script>
</body>
</html>
